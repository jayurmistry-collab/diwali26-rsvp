<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diwali RSVP</title>
<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#4a0016;
    color:white;
}
.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}
.invite{
    text-align:center;
}
.invite img{
    width:100%;
    max-width:500px;
    height:auto;
    border-radius:10px;
    box-shadow:0 0 20px rgba(255,215,0,.4);
}
.form-card{
    margin-top:25px;
    background:white;
    color:#333;
    padding:25px;
    border-radius:10px;
}
h1{
    text-align:center;
    color:#d4a017;
}
h3{
    text-align:center;
}
label{
    font-weight:bold;
    display:block;
    margin-top:15px;
}
input,select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
    font-size:16px;
}
button{
    margin-top:20px;
    width:100%;
    background:#b8860b;
    color:white;
    border:none;
    padding:15px;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}
button:hover{
    background:#8b6508;
}
</style>
</head>
<body>
<div class="container">
    <div class="invite">
        <img src="invitation.jpg" alt="Diwali invitation: Saturday, 7th November, 6 PM onwards, 22436 Isla Way, Rogers, MN">
        <h1>Diwali Celebration RSVP</h1>
        <h3>November 7 • 6 PM Onwards</h3>
        <p>22436 Isla Way, Rogers, MN</p>
    </div>

    <div class="form-card">
        <form action="https://formsubmit.co/jayur.mistry@gmail.com" method="POST">
            <label for="name">Name</label>
            <input type="text" id="name" name="Name" required>

            <label for="joining">Joining?</label>
            <select id="joining" name="Joining" required>
                <option value="">Select</option>
                <option>Yes</option>
                <option>No</option>
            </select>

            <label for="guests">Total Individuals Joining</label>
            <input type="number" id="guests" name="Guests" min="0" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="Phone" required>

            <!-- Email formatting -->
            <input type="hidden" name="_subject" value="New Diwali RSVP">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_captcha" value="false">

            <button type="submit">Submit RSVP</button>
        </form>
    </div>
</div>
</body>
</html>
