<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diwali RSVP</title>
<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#4a0016;
    color:white;
}
.container{
    max-width:800px;
    margin:auto;
    padding:20px;
}
.invite{
    text-align:center;
}
.invite img{
    width:100%;
    max-width:500px;
    height:auto;
    border-radius:10px;
    box-shadow:0 0 20px rgba(255,215,0,.4);
}
.form-card{
    margin-top:25px;
    background:white;
    color:#333;
    padding:25px;
    border-radius:10px;
}
h1{
    text-align:center;
    color:#d4a017;
}
h3{
    text-align:center;
}
label{
    font-weight:bold;
    display:block;
    margin-top:15px;
}
input,select{
    width:100%;
    padding:12px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
    font-size:16px;
}
button{
    margin-top:20px;
    width:100%;
    background:#b8860b;
    color:white;
    border:none;
    padding:15px;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}
button:hover{
    background:#8b6508;
}
button:disabled{
    background:#999;
    cursor:not-allowed;
}
.hidden-trap{
    position:absolute;
    left:-9999px;
}
#status{
    margin-top:15px;
    padding:12px;
    border-radius:6px;
    display:none;
    text-align:center;
}
#status.ok{
    display:block;
    background:#e6f4ea;
    color:#1e6b34;
}
#status.err{
    display:block;
    background:#fdecea;
    color:#a12622;
}
</style>
</head>
<body>
<div class="container">
    <div class="invite">
        <img src="invitation.jpg" alt="Diwali invitation: Saturday, 7th November, 6 PM onwards, 22436 Isla Way, Rogers, MN">
        <h1>Diwali Celebration RSVP</h1>
        <h3>November 7 • 6 PM Onwards</h3>
        <p>22436 Isla Way, Rogers, MN</p>
    </div>

    <div class="form-card">
        <!-- REPLACE YOUR_FORM_ID with the ID from your Formspree form URL (https://formspree.io/f/YOUR_FORM_ID) -->
        <form id="rsvp-form" action="https://formspree.io/f/xppwbkao" method="POST">
            <label for="name">Name</label>
            <input type="text" id="name" name="Name" required>

            <label for="joining">Joining?</label>
            <select id="joining" name="Joining" required>
                <option value="">Select</option>
                <option>Yes</option>
                <option>No</option>
            </select>

            <label for="guests">Total Individuals Joining</label>
            <input type="number" id="guests" name="Guests" min="0" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="Phone" required>

            <!-- Email subject line -->
            <input type="hidden" name="_subject" value="New Diwali RSVP">

            <!-- Spam trap: real guests never see or fill this in -->
            <input type="text" name="_gotcha" class="hidden-trap" tabindex="-1" autocomplete="off">

            <button type="submit" id="submit-btn">Submit RSVP</button>
            <div id="status" role="status"></div>
        </form>
    </div>
</div>

<script>
const form = document.getElementById("rsvp-form");
const btn = document.getElementById("submit-btn");
const status = document.getElementById("status");

form.addEventListener("submit", async function (e) {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "Sending...";
    status.className = "";
    status.textContent = "";

    try {
        const response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: { "Accept": "application/json" }
        });

        if (response.ok) {
            form.reset();
            status.className = "ok";
            status.textContent = "Thank you! Your RSVP has been received. We can't wait to celebrate with you.";
            btn.textContent = "RSVP sent";
        } else {
            throw new Error("Server responded with " + response.status);
        }
    } catch (err) {
        status.className = "err";
        status.textContent = "Sorry, something went wrong and your RSVP was not sent. Please try again, or contact Jinal & Jayur directly.";
        btn.disabled = false;
        btn.textContent = "Submit RSVP";
    }
});
</script>
</body>
</html>
